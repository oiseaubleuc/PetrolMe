<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oilconnect command rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:100%;min-width:230px;min-height:100%;box-sizing:border-box;padding:14px;background:#0D1015;display:flex;font-family:'Space Grotesk',Inter,system-ui,sans-serif;color:#E6EAF0">
<nav aria-label="Main" style="flex:1;border-radius:20px;border:1px solid #1F2A33;background:#0F151B;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(61,220,151,.05),0 24px 60px rgba(0,0,0,.45);padding:18px 12px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:10px;padding:0 6px">
<div style="width:34px;height:34px;border-radius:10px;border:1px solid #2C6B50;background:#10261D;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(61,220,151,.25)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5C8 8 6 11.2 6 14a6 6 0 0 0 12 0c0-2.8-2-6-6-11.5z"></path><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5"></path></svg>
</div>
<div>
<div style="font-size:17px;font-weight:700;letter-spacing:-.01em">Oilconnect</div>
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#3DDC97;margin-top:2px;display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#3DDC97;box-shadow:0 0 8px #3DDC97"></span>LIVE · DESK 01</div>
</div>
</div>

<button style="display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;border:1px solid #232E38;background:#0B1015;color:#8B95A5;font:inherit;font-size:12px;cursor:pointer;text-align:left">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex:1">Ask or search…</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 6px;border-radius:5px;border:1px solid #2E3541;color:#A6AFBD">⌘K</span>
</button>

<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="7">
<sc-if value="{{item.active}}" hint-placeholder-val="{{false}}">
<a href="{{item.href}}" aria-current="page" style="position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:1px solid #2C6B50;background:#10261D;color:#E6EAF0;font-size:13px;font-weight:500;text-decoration:none;box-shadow:0 0 22px rgba(61,220,151,.14)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="flex:1">{{item.label}}</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#3DDC97">{{item.n}}</span>
</a>
</sc-if>
<sc-if value="{{item.idle}}" hint-placeholder-val="{{true}}">
<a href="{{item.href}}" style="display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:1px solid transparent;color:#A6AFBD;font-size:13px;text-decoration:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="flex:1">{{item.label}}</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#56606E">{{item.n}}</span>
</a>
</sc-if>
</sc-for>
</div>

<div style="border-radius:14px;border:1px solid #232E38;background:#0B1015;padding:12px;display:flex;flex-direction:column;gap:10px">
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8B95A5">MARKET PULSE</div>
<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px"><span>BRENT</span><span style="font-family:'JetBrains Mono',monospace">77.10 <span style="color:#3DDC97">▲0.9%</span></span></div>
<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px"><span>WTI</span><span style="font-family:'JetBrains Mono',monospace">73.40 <span style="color:#3DDC97">▲1.0%</span></span></div>
<svg viewBox="0 0 160 30" style="width:100%;height:30px;display:block" aria-hidden="true"><polyline points="0,24 14,22 28,25 42,18 56,20 70,14 84,16 98,10 112,12 126,7 140,9 160,4" fill="none" stroke="#3DDC97" stroke-width="1.5"></polyline></svg>
</div>

<div style="border-radius:14px;border:1px solid #2B3A55;background:#101827;padding:12px">
<div style="display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#7AB8FF">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"></path></svg>AI DESK</div>
<div style="font-size:12px;margin-top:8px;line-height:1.45">3 new signals · Brent–WTI arb open to Rotterdam</div>
<a href="Markets.dc.html" style="display:inline-block;margin-top:8px;font-size:12px;color:#7AB8FF;text-decoration:none">Review signals →</a>
</div>

<div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid #1F2A33">
<div style="width:32px;height:32px;border-radius:50%;background:#1A2430;border:1px solid #2C6B50;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#3DDC97">OC</div>
<div style="flex:1"><div style="font-size:12px;font-weight:500">Global oil desk</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#8B95A5;margin-top:2px">USD · DEMO</div></div>
</div>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","trade","markets","portfolio","shipments","inventory","counterparties"],"default":"overview"},"$preview":{"width":260,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'overview';
    const nav = [
      ['overview', 'Overview', 'Main.dc.html', 'M3 3h7v7H3zM14 3h7v4h-7zM14 11h7v10h-7zM3 14h7v7H3z'],
      ['trade', 'Buy & Sell', 'Trade.dc.html', 'M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4'],
      ['markets', 'Oil markets', 'Markets.dc.html', 'M3 17l5-5 4 4 8-9M15 7h5v5'],
      ['portfolio', 'Portfolio', 'Portfolio.dc.html', 'M3 7h18v13H3zM8 7V4h8v3M3 12h18'],
      ['shipments', 'Shipments', 'Shipments.dc.html', 'M3 15h18l-2 5H5zM6 15V9h12v6M12 9V4M9 4h6'],
      ['inventory', 'Inventory', 'Inventory.dc.html', 'M5 4h14v16H5zM5 10h14M5 15h14'],
      ['counterparties', 'Counterparties', 'Counterparties.dc.html', 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 3.5a4 4 0 0 1 0 7.5M22 21a7 7 0 0 0-4-6.3']
    ];
    return { items: nav.map((n, i) => ({ label: n[1], href: n[2], d: n[3], n: '0' + (i + 1), active: a === n[0], idle: a !== n[0] })) };
  }
}
</script>
</body>
</html>
